; Tide clock for the Xteink X4 (ESP32-C3 + 4.26" 800x480 SSD1677 e-paper).
;
;   pio run -e x4 -t upload     flash the reader
;   pio run -e sim -t exec      render screenshots on the host
;
; Both environments compile lib/tideui, so the simulator's PNG output is
; pixel-identical to the panel.

[platformio]
default_envs = x4
src_dir = src

[env]
lib_deps = bblanchon/ArduinoJson@^7.4.3

[env:x4]
platform = espressif32@^6.12.0
board = esp32-c3-devkitm-1
framework = arduino
build_src_filter = +<device/>
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; The X4 exposes USB serial/JTAG, so Serial should go over USB.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; GxEPD2 keeps a full 800x480 page in RAM; 48 kB fits the C3 comfortably.
    -DEPD_PAGE_HEIGHT=480
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@^1.6.4
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
; Without PlatformIO's udev rules installed, port auto-detection does not
; recognise the C3's USB Serial/JTAG interface and falls back to the first
; tty it finds -- usually a motherboard /dev/ttyS0 that fails to open. The
; native USB port always enumerates as ttyACM on Linux, so name it directly.
; Mac users want /dev/cu.usbmodem* here, or the udev rules make both moot:
; https://docs.platformio.org/en/latest/core/installation/udev-rules.html
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Hardware probe. Prints the chip, clock, pin and button survey behind
; docs/hardware.md; never flashed as part of normal use.
[env:diag]
extends = env:x4
build_src_filter = +<diag/>
lib_deps = ${env.lib_deps}

; Host renderer. Draws the same screen into a PNG for rapid UI iteration.
[env:sim]
platform = native
build_src_filter = +<host/>
build_flags =
    -std=gnu++17
    -O1
    -Wall
    -Wno-unused-function
extra_scripts = pre:tools/sim_targets.py
